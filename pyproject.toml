[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-guard"
version = "0.1.0"
description = "Learning project: read-only AWS security posture scanner and Terraform checker mapped to CIS AWS Foundations Benchmark v3.0.0"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "the project author" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
# Ranges here; exact pins for reproducible installs live in requirements.txt.
dependencies = [
    "boto3>=1.34",
    "moto[iam,s3,s3control,cloudtrail,ec2,sts]>=5.0,<6",
    "python-hcl2>=8.0,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cloud-guard = "cloud_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
